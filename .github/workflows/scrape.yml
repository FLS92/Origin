name: Scrape roasters

on:
  schedule:
    - cron: "0 5 * * 1"  # weekly, Monday 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write  # needed to git push the updated data/ and docs/coffees-data.json

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run scrapers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 run.py

      - name: Rebuild app data
        run: python3 scripts/build_app_data.py

      - name: Commit updated data
        run: |
          git config user.name "origin-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/coffees-data.json
          git diff --cached --quiet || git commit -m "Scraping automatique: mise à jour des catalogues"
          git push
